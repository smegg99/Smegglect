<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boundaries</title>
  <style>
    body { margin: 0; padding: 24px; font: 14px system-ui, sans-serif; display: grid; grid-template-columns: repeat(2, 320px); gap: 24px; }
    .frame { width: 300px; height: 120px; border: 1px solid #999; }
    open-card, closed-card { display: block; width: 300px; height: 80px; }
    #scroller { width: 300px; height: 120px; overflow: auto; border: 1px solid #999; }
    #scroller .tall { height: 400px; padding-top: 180px; }
  </style>
</head>
<body>
  <open-card id="open-host"></open-card>
  <closed-card id="closed-host"></closed-card>
  <iframe id="frame" class="frame" sandbox="allow-scripts" srcdoc="<button id=inner>Inside frame</button>"></iframe>
  <canvas id="canvas" width="300" height="120" style="background: #e8e3ee"></canvas>
  <div id="scroller"><div class="tall"><button id="deep" type="button">Scrolled button</button></div></div>
  <button id="toggle" type="button" aria-pressed="false">Toggle</button>
  <script type="module" src="./fixtures/boundaries.ts"></script>
</body>
</html>
