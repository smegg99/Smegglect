<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dense workbench</title>
  <link rel="stylesheet" href="./fixtures/workbench.css">
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Places">
      <button type="button" class="rk here" aria-label="Plans"><svg viewBox="0 0 24 24"><path d="M3 4h18v2H3zm0 7h18v2H3zm0 7h18v2H3z" /></svg></button>
      <button type="button" class="rk" aria-label="Rooms"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z" /></svg></button>
      <button type="button" class="rk" aria-label="Teachers"><svg viewBox="0 0 24 24"><path d="M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm0 10c4.4 0 8 1.8 8 4v2H4v-2c0-2.2 3.6-4 8-4z" /></svg></button>
    </aside>
    <div class="main">
      <div class="strip">
        <button type="button" class="kk on">Tones</button>
        <button type="button" class="kk">Octaves</button>
        <button type="button" class="kk">Chords</button>
        <span class="sep"></span>
        <button type="button" class="kk icon" aria-label="Previous">&lt;</button>
        <span class="field" id="note">C4</span>
        <button type="button" class="kk icon" aria-label="Next">&gt;</button>
        <span class="grow"></span>
        <button type="button" class="kk" id="settings">Settings</button>
      </div>
      <section class="panel" id="schedule">
        <header class="head"><span>Schedule</span><span class="meta">Week 46</span></header>
        <div class="grid" id="grid"></div>
      </section>
      <section class="panel tiles">
        <div class="tile" id="tile-1"><span class="t">Reed 1</span><b>+5.0</b></div>
        <div class="tile" id="tile-2"><span class="t">Beat 1 to 2</span><b>0.73</b></div>
        <div class="tile" id="tile-3" style="height: 66px"><span class="t">Reed 2</span><b>+9.6</b></div>
      </section>
    </div>
  </div>
  <script type="module" src="./fixtures/workbench.ts"></script>
</body>
</html>
