add:
  value: "Add issue"
  description: "Composer primary key"
exists:
  value: "Already reported as issue {number}."
  description: "Composer notice for an identical issue"
  placeholders:
    number: {type: integer}
open:
  value: "Open issue {number}"
  description: "Key that opens the existing issue"
  placeholders:
    number: {type: integer}
title:
  value: "New issue"
  description: "Accessible name of the area where an issue is written"
whatsWrong:
  value: "What's wrong?"
  description: "Placeholder and name of the note field where an issue is written"
type:
  value: "Type"
  description: "Accessible name of the row of issue types"
everywhere:
  value: "Everywhere this component is used"
  description: "Checkbox: the fix belongs in the shared component, not only this element"
images:
  plural:
    argument: count
    forms:
      one: "{count} pasted image will be attached"
      other: "{count} pasted images will be attached"
  description: "Under the note: images pasted while writing, attached when the issue is added"
  placeholders:
    count: {type: integer}
imagesClear:
  value: "Remove"
  description: "Drops the pasted images before the issue is added"
