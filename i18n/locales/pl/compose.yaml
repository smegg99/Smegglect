add:
  value: "Dodaj zgłoszenie"
  description: "Composer primary key"
exists:
  value: "Już zgłoszone jako zgłoszenie {number}."
  description: "Composer notice for an identical issue"
  placeholders:
    number: {type: integer}
open:
  value: "Otwórz zgłoszenie {number}"
  description: "Key that opens the existing issue"
  placeholders:
    number: {type: integer}
title:
  value: "Nowe zgłoszenie"
  description: "Accessible name of the area where an issue is written"
whatsWrong:
  value: "Co jest nie tak?"
  description: "Placeholder and name of the note field where an issue is written"
type:
  value: "Rodzaj"
  description: "Accessible name of the row of issue types"
everywhere:
  value: "Wszędzie, gdzie jest ten komponent"
  description: "Checkbox: the fix belongs in the shared component, not only this element"
images:
  plural:
    argument: count
    forms:
      one: "{count} wklejony obraz zostanie dołączony"
      few: "{count} wklejone obrazy zostaną dołączone"
      many: "{count} wklejonych obrazów zostanie dołączonych"
      other: "{count} wklejonego obrazu zostanie dołączone"
  description: "Under the note: images pasted while writing, attached when the issue is added"
  placeholders:
    count: {type: integer}
imagesClear:
  value: "Usuń"
  description: "Drops the pasted images before the issue is added"
